<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <title>Change URL</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #16213e;
        color: #e0e0e0;
        border: 1px solid #1f2e4d;
        padding: 16px 18px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        -webkit-app-region: drag;
        user-select: none;
      }
      label {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #8b93a7;
      }
      input {
        -webkit-app-region: no-drag;
        width: 100%;
        background: #0f0f1a;
        border: 1px solid #2a3a5e;
        border-radius: 6px;
        color: #e0e0e0;
        font-size: 14px;
        padding: 9px 11px;
        outline: none;
        user-select: text;
      }
      input:focus {
        border-color: #4ecca3;
      }
      .actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
      }
      button {
        -webkit-app-region: no-drag;
        border: none;
        border-radius: 6px;
        padding: 7px 16px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }
      .cancel {
        background: #24304f;
        color: #c8cede;
      }
      .ok {
        background: #4ecca3;
        color: #0f0f1a;
      }
    </style>
  </head>
  <body>
    <label for="url">Change URL</label>
    <input id="url" type="text" spellcheck="false" />
    <div class="actions">
      <button class="cancel" id="cancel">Cancel</button>
      <button class="ok" id="ok">Open</button>
    </div>
    <script>
      const input = document.getElementById("url");
      input.value = window.urlPrompt.initialUrl;
      input.focus();
      input.select();

      const submit = () => {
        const url = input.value.trim();
        if (url) window.urlPrompt.submit(url);
      };
      document.getElementById("ok").addEventListener("click", submit);
      document
        .getElementById("cancel")
        .addEventListener("click", () => window.urlPrompt.cancel());
      document.addEventListener("keydown", (e) => {
        if (e.key === "Enter") submit();
        if (e.key === "Escape") window.urlPrompt.cancel();
      });
    </script>
  </body>
</html>
