# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Electron CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  release:
    types: [created]

jobs:
  # On pushes to main, release automatically when package.json has a version
  # that doesn't have a GitHub release yet.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
    - uses: actions/checkout@v4

    - name: Check for unreleased version
      id: check
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        version=$(jq -r .version package.json)
        echo "version=$version" >> "$GITHUB_OUTPUT"
        if [ "${{ github.event_name }}" != "push" ]; then
          should_release=false
        elif gh release view "$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
          echo "Release $version already exists"
          should_release=false
        else
          echo "Version $version has no release yet – will publish one"
          should_release=true
        fi
        echo "should_release=$should_release" >> "$GITHUB_OUTPUT"

  build:

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos

    runs-on: ${{ matrix.os }}

    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4

    - name: Setup Bun runtime
      uses: oven-sh/setup-bun@v1
      with:
          bun-version: latest

    - name: Install dependencies
      run: bun install

    - name: Install Linux packaging tools
      if: matrix.os == 'ubuntu-latest'
      run: sudo apt-get update && sudo apt-get install -y rpm

    - name: Build
      if: matrix.os != 'macos-latest'
      run: bun run make

    - name: Build macOS
      if: matrix.os == 'macos-latest'
      run: bun run make --platform=darwin --arch=x64,arm64

    - name: List make output
      shell: bash
      run: find build/make -type f 2>/dev/null | sort || echo 'No files found in build/make'

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
          name: ${{ matrix.name }}-build-artifact
          path: build/make
          retention-days: 7

  # Publishes once after both builds finish, either into a new release for an
  # unreleased version, or into a release that was created by hand.
  release:
    needs: [version, build]
    if: github.event_name == 'release' || needs.version.outputs.should_release == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
          path: artifacts

    - name: Upload to release
      uses: softprops/action-gh-release@v2
      with:
          # Manual releases use their own tag; automatic ones use the version,
          # matching the existing "1.0.1" tag / "v1.0.1" title convention.
          tag_name: ${{ github.event_name == 'release' && github.event.release.tag_name || needs.version.outputs.version }}
          name: ${{ github.event_name != 'release' && format('v{0}', needs.version.outputs.version) || '' }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: ${{ github.event_name != 'release' }}
          fail_on_unmatched_files: true
          files: |
              artifacts/**/*.exe
              artifacts/**/*.deb
              artifacts/**/*.rpm
              artifacts/**/*.zip
              artifacts/**/*.dmg
